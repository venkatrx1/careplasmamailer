name = "careplasma-mailer-api"
main = "index.js"
compatibility_date = "2025-07-18"

# Plain (non-secret) variables — safe to commit.
# Set GMAIL_USER / GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REFRESH_TOKEN
# separately as secrets via `wrangler secret put` (see README.md); never put them here.
[vars]
ALLOWED_ORIGIN = "*"
MAIL_TO = "info@careplasma.com, venkatrx1@gmail.com"

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
